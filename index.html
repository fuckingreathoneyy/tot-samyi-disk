<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тот самый диск</title>
  <style>
    body {
      background: #1a1a1a;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #ffcc00;
      font-size: 48px;
    }
    p {
      font-size: 20px;
      color: #aaa;
    }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
      cursor: pointer;
      transition: 0.3s;
    }
    .card:hover {
      background: #3a3a3a;
    }
    .card img {
      width: 100%;
      border-radius: 8px;
    }
    .card h2 {
      color: #ffcc00;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Тот самый диск</h1>
  <p>Игры, которые мы помним. Игры, в которые мы играли.</p>

  <!-- Это карточка игры. Потом мы добавим ещё -->
  <a href="https://example.com" target="_blank" style="text-decoration: none; color: inherit;">
    <div class="card">
      <img src="https://via.placeholder.com/400x300?text=Кунг-фу+Панда" alt="Кунг-фу Панда">
      <h2>Кунг-фу Панда</h2>
    </div>
  </a>

</body>
</html>
