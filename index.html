<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тот самый диск</title>
  <style>
    body {
      background: #1a1a1a;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #ffcc00;
      font-size: 48px;
    }
    p {
      font-size: 20px;
      color: #aaa;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      max-width: 1000px;
      margin: 50px auto;
    }
    .disk {
      display: block;
      transition: transform 0.3s;
    }
    .disk:hover {
      transform: scale(1.1);
    }
    .disk img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Тот самый диск</h1>
  <p>Игры, которые мы помним. Игры, в которые мы играли.</p>

  <div class="grid">
    <a href="#" target="_blank" class="disk">
      <img src="disk1.png" alt="Игра 1">
    </a>
    <a href="#" target="_blank" class="disk">
      <img src="disk2.png" alt="Игра 2">
    </a>
    <a href="#" target="_blank" class="disk">
      <img src="disk3.png" alt="Игра 3">
    </a>
    <a href="#" target="_blank" class="disk">
      <img src="disk4.png" alt="Игра 4">
    </a>
  </div>

</body>
</html>
